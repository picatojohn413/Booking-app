<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King Enterprise</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg: #F6F4EF; --panel: #FFFFFF; --ink: #22322D; --ink-soft: #5B6B63;
    --line: #DFDACB; --teal: #4C7A8C; --amber: #C9962B; --rust: #B5542A; --green: #5B8C5A;
    --radius-card: 14px; --radius-pill: 999px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding-bottom: 84px; }
  .display{ font-family: Georgia, "Times New Roman", serif; }

  header.top{ padding: 18px 18px 16px; border-bottom: 1px solid var(--line); background: var(--panel); display:flex; align-items:center; justify-content:space-between; gap: 10px; }
  header.top .htext h1{ margin:0; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
  header.top .htext p{ margin: 4px 0 0; color: var(--ink-soft); font-size: 12.5px; }
  .gear-btn{ background: none; border: 1px solid var(--line); border-radius: 50%; width: 38px; height:38px; font-size: 17px; display:flex; align-items:center; justify-content:center; color: var(--ink-soft); flex-shrink:0; cursor:pointer; }

  .stats{ display:flex; gap:10px; padding: 14px 18px 0; }
  .stat{ flex:1; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 12px 14px; }
  .stat .num{ font-size: 22px; font-weight: 700; line-height:1; }
  .stat .lbl{ font-size: 11.5px; color: var(--ink-soft); margin-top:4px; }
  .stat.alert .num{ color: var(--rust); }

  main{ padding: 16px 18px 8px; }
  .section-title{ font-size: 15px; font-weight: 700; margin: 18px 0 10px; display:flex; align-items:center; justify-content:space-between; }

  .card{ background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 13px 14px; margin-bottom: 10px; }

  .order-card .row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .order-card .cust{ font-weight:700; font-size:14.5px; }
  .order-card .phone{ font-size:12px; color: var(--ink-soft); margin-top:2px;}
  .order-card .items{ font-size:13px; color: var(--ink); margin-top:8px; line-height:1.5; }
  .order-card .items .li{ display:flex; justify-content:space-between; }
  .order-card .totals{ margin-top:9px; padding-top:9px; border-top:1px dashed var(--line); font-size:13px; }
  .order-card .totals .row{ display:flex; justify-content:space-between; }
  .order-card .totals .disc{ color: var(--rust); }
  .order-card .totals .final{ font-weight:700; font-size:14.5px; margin-top:3px; }
  .order-card .meta{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .order-card .date{ font-size:11.5px; color: var(--ink-soft); }
  .order-card .del-order{ background:none; border:none; color: var(--ink-soft); font-size:16px; padding: 2px 6px; cursor:pointer; }

  select.status-select{ font-size: 11.5px; font-weight:700; border-radius: var(--radius-pill); border: 1px solid var(--line); padding: 4px 8px; background: var(--panel); color: var(--ink); }

  .product-card{ display:flex; gap:12px; align-items:center; }
  .product-card .pimg{ width: 52px; height:52px; border-radius: 10px; object-fit: cover; background: var(--bg); border: 1px solid var(--line); flex-shrink:0; }
  .product-card .pimg.placeholder{ display:flex; align-items:center; justify-content:center; font-size:20px; color: var(--line); }
  .product-card .pinfo{ flex:1; min-width:0; }
  .product-card .pname{ font-weight:600; font-size:14px; }
  .product-card .pcode{ font-size:11px; color: var(--teal); font-weight:600; }
  .product-card .pcat{ font-size:11.5px; color: var(--ink-soft); margin-top:2px; }
  .product-card .pright{ text-align:right; flex-shrink:0; }
  .product-card .pprice{ font-size:13px; font-weight:700; }
  .product-card .pstock{ font-size:12px; margin-top:3px; }
  .pstock.ok{ color: var(--green); }
  .pstock.low{ color: var(--rust); font-weight:700; }

  .customer-card{ display:flex; justify-content:space-between; align-items:center; }
  .customer-card .cname{ font-weight:700; font-size:14.5px; }
  .customer-card .cphone{ font-size:12px; color: var(--ink-soft); margin-top:2px; }
  .customer-card .cdisc{ font-size:12.5px; font-weight:700; color: var(--teal); background:#E4EEF1; padding:4px 10px; border-radius: var(--radius-pill); }

  .empty{ text-align:center; color: var(--ink-soft); font-size: 13px; padding: 30px 10px; }

  nav.tabs{ position:fixed; bottom:0; left:0; right:0; background: var(--panel); border-top: 1px solid var(--line); display:flex; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabs button{ flex:1; background:none; border:none; padding: 8px 4px; font-size: 11px; font-weight: 600; color: var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
  nav.tabs button.active{ color: var(--teal); }
  nav.tabs .icon{ font-size:18px; line-height:1; }

  .fab{ position: fixed; right: 18px; bottom: 76px; width: 52px; height:52px; border-radius: 50%; background: var(--teal); color:#fff; border:none; font-size: 26px; box-shadow: 0 6px 16px rgba(76,122,140,0.35); cursor:pointer; display:flex; align-items:center; justify-content:center; }

  .sheet-overlay{ position:fixed; inset:0; background: rgba(34,50,45,0.35); display:none; align-items:flex-end; z-index: 50; }
  .sheet-overlay.open{ display:flex; }
  .sheet{ background: var(--panel); width:100%; border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y:auto; }
  .sheet h2{ margin: 0 0 14px; font-size: 17px; }
  .field{ margin-bottom: 12px; }
  .field label{ display:block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 5px; font-weight:600; }
  .field input, .field select, .field textarea{ width:100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; background: #FBFAF7; color: var(--ink); font-family: inherit; }
  .row2{ display:flex; gap:8px; }
  .row2 .field{ flex:1; }

  .item-row{ display:flex; gap:8px; align-items:flex-end; margin-bottom: 8px; }
  .item-row .field{ margin-bottom:0; }
  .item-row .code-field{ flex: 1.6; }
  .item-row .qty-field{ flex:0.8; }
  .item-row .found-name{ font-size:11px; color: var(--green); margin-top:3px; min-height:14px; }
  .item-row .found-name.notfound{ color: var(--rust); }
  .item-row button{ background: none; border: none; color: var(--rust); font-size: 20px; padding: 0 4px 8px; cursor:pointer; }
  .add-item-btn{ background:none; border: 1px dashed var(--line); color: var(--teal); font-weight:600; font-size: 13px; padding: 9px; border-radius: 10px; width:100%; cursor:pointer; margin-bottom: 14px; }

  .totals-box{ padding: 10px 0; border-top: 1px dashed var(--line); margin-bottom: 14px; }
  .totals-box .trow{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px; }
  .totals-box .trow.final{ font-weight:700; font-size: 15.5px; margin-top:6px; }
  .totals-box .trow.disc{ color: var(--rust); }

  .save-btn{ width:100%; background: var(--teal); color:#fff; border:none; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor:pointer; }
  .danger-btn{ width:100%; background: #FBEAE3; color: var(--rust); border:none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor:pointer; margin-top: 8px; }
  .cancel-btn{ width:100%; background:none; border:none; color: var(--ink-soft); padding: 10px; font-size: 13.5px; text-align:center; cursor:pointer; }

  .img-picker{ display:flex; align-items:center; gap:12px; margin-bottom: 12px; }
  .img-preview{ width: 64px; height:64px; border-radius: 12px; object-fit:cover; background: var(--bg); border: 1px dashed var(--line); }
  .img-preview.placeholder{ display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--ink-soft); }
  .img-picker label.pick-btn{ display:inline-block; background: var(--bg); border: 1px solid var(--line); color: var(--ink); font-size: 13px; font-weight:600; padding: 9px 14px; border-radius: 10px; cursor:pointer; margin:0; }
  .img-picker input[type=file]{ display:none; }

  .cat-row{ display:flex; gap:8px; }
  .cat-row select{ flex:1; }
  .cat-row button{ background: var(--bg); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; font-weight:600; padding: 0 12px; color: var(--teal); cursor:pointer; }

  .disc-type-row{ display:flex; gap:8px; margin-bottom:12px; }
  .disc-type-row button{ flex:1; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft); font-size: 13px; font-weight:600; cursor:pointer; }
  .disc-type-row button.active{ background: var(--teal); color:#fff; border-color: var(--teal); }
</style>
</head>
<body>

<header class="top">
  <div class="htext">
    <h1 class="display" id="shopName">King Enterprise</h1>
    <p id="shopTag">Apni products ki bookings track karein</p>
  </div>
  <button class="gear-btn" id="settingsBtn">⚙</button>
</header>

<div class="stats" id="statsRow"></div>

<main id="mainContent">
  <div class="empty">Loading...</div>
</main>

<button class="fab" id="fabBtn">+</button>

<nav class="tabs">
  <button class="tab-btn active" data-tab="orders"><span class="icon">🧾</span>Orders</button>
  <button class="tab-btn" data-tab="customers"><span class="icon">👥</span>Customers</button>
  <button class="tab-btn" data-tab="stock"><span class="icon">📦</span>Stock</button>
</nav>

<!-- Settings Sheet -->
<div class="sheet-overlay" id="settingsSheetOverlay">
  <div class="sheet">
    <h2>Shop Ki Details</h2>
    <div class="field"><label>Shop / Business ka naam</label><input type="text" id="setShopName"></div>
    <div class="field"><label>Tagline</label><input type="text" id="setShopTag"></div>
    <div class="field"><label>Contact number</label><input type="tel" id="setShopPhone"></div>
    <div class="field"><label>Address</label><textarea id="setShopAddress" rows="2"></textarea></div>
    <button class="save-btn" id="saveSettingsBtn">Save</button>
    <button class="cancel-btn" id="cancelSettingsBtn">Band Karein</button>
  </div>
</div>

<!-- Add Order Sheet -->
<div class="sheet-overlay" id="orderSheetOverlay">
  <div class="sheet">
    <h2>Nayi Booking</h2>
    <div class="field">
      <label>Customer chunein (ya khali chorein naye ke liye)</label>
      <select id="orderCustomerSelect"></select>
    </div>
    <div class="field"><label>Customer ka naam</label><input type="text" id="custName" placeholder="e.g. Ahmed Bhai"></div>
    <div class="field"><label>Phone number (optional)</label><input type="tel" id="custPhone" placeholder="03xx-xxxxxxx"></div>

    <label style="display:block; font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:6px;">Products (code ya naam likhein)</label>
    <div id="itemRows"></div>
    <datalist id="productsDatalist"></datalist>
    <button class="add-item-btn" id="addItemBtn">+ Product add karein</button>

    <div class="field">
      <label>Discount</label>
      <div class="disc-type-row">
        <button type="button" class="disc-type-btn active" data-type="none">Koi Nahi</button>
        <button type="button" class="disc-type-btn" data-type="percent">Percent %</button>
        <button type="button" class="disc-type-btn" data-type="fixed">Rs. Fixed</button>
      </div>
      <input type="number" id="discountValue" placeholder="Discount value" style="display:none;">
    </div>

    <div class="totals-box">
      <div class="trow"><span>Subtotal</span><span id="subtotalDisplay">Rs. 0</span></div>
      <div class="trow disc" id="discountRow" style="display:none;"><span>Discount</span><span id="discountDisplay">- Rs. 0</span></div>
      <div class="trow final"><span>Total</span><span id="orderTotalDisplay">Rs. 0</span></div>
    </div>

    <button class="save-btn" id="saveOrderBtn">Booking save karein</button>
    <button class="cancel-btn" id="cancelOrderBtn">Cancel</button>
  </div>
</div>

<!-- Add/Edit Product Sheet -->
<div class="sheet-overlay" id="productSheetOverlay">
  <div class="sheet">
    <h2 id="productSheetTitle">Naya Product</h2>
    <div class="img-picker">
      <img id="prodImgPreview" class="img-preview placeholder" src="">
      <label class="pick-btn" for="prodImgInput">Tasveer Chunein</label>
      <input type="file" id="prodImgInput" accept="image/*">
    </div>
    <div class="field"><label>Product ka naam</label><input type="text" id="prodName" placeholder="e.g. Shoe Polish Kit"></div>
    <div class="row2">
      <div class="field"><label>Product Code (optional)</label><input type="text" id="prodCode" placeholder="e.g. SC-001"></div>
    </div>
    <div class="field">
      <label>Category / Range</label>
      <div class="cat-row">
        <select id="prodCategory"></select>
        <button type="button" id="newCatBtn">+ Nayi</button>
      </div>
    </div>
    <div class="field" id="newCatField" style="display:none;">
      <label>Nayi category ka naam</label>
      <input type="text" id="newCatInput" placeholder="e.g. Car Care">
    </div>
    <div class="row2">
      <div class="field"><label>Price (Rs.)</label><input type="number" id="prodPrice" placeholder="0" min="0"></div>
      <div class="field"><label>Stock</label><input type="number" id="prodStock" placeholder="0" min="0"></div>
    </div>
    <button class="save-btn" id="saveProductBtn">Product save karein</button>
    <button class="danger-btn" id="deleteProductBtn" style="display:none;">Product Delete Karein</button>
    <button class="cancel-btn" id="cancelProductBtn">Cancel</button>
  </div>
</div>

<!-- Add/Edit Customer Sheet -->
<div class="sheet-overlay" id="customerSheetOverlay">
  <div class="sheet">
    <h2 id="customerSheetTitle">Naya Customer / Shop</h2>
    <div class="field"><label>Naam</label><input type="text" id="custFormName" placeholder="e.g. Ali Store"></div>
    <div class="field"><label>Phone number</label><input type="tel" id="custFormPhone" placeholder="03xx-xxxxxxx"></div>
    <div class="field">
      <label>Discount Type</label>
      <div class="disc-type-row">
        <button type="button" class="cust-disc-type-btn active" data-type="none">Koi Nahi</button>
        <button type="button" class="cust-disc-type-btn" data-type="percent">Percent %</button>
        <button type="button" class="cust-disc-type-btn" data-type="fixed">Rs. Fixed</button>
      </div>
      <input type="number" id="custFormDiscValue" placeholder="Discount value" style="display:none;">
    </div>
    <button class="save-btn" id="saveCustomerBtn">Save</button>
    <button class="danger-btn" id="deleteCustomerBtn" style="display:none;">Delete Karein</button>
    <button class="cancel-btn" id="cancelCustomerBtn">Cancel</button>
  </div>
</div>

function saveProducts(){ try{ localStorage.setItem('kb_products', JSON.stringify(products)); }catch(e){ alert('Save nahi ho saka - storage bhar gaya hai.'); } }
function saveOrders(){ try{ localStorage.setItem('kb_orders', JSON.stringify(orders)); }catch(e){} }
function saveCustomers(){ try{ localStorage.setItem('kb_customers', JSON.stringify(customers)); }catch(e){} }
function saveCategories(){ try{ localStorage.setItem('kb_categories', JSON.stringify(categories)); }catch(e){} }
function saveSettings(){ try{ localStorage.setItem('kb_settings', JSON.stringify(shopSettings)); }catch(e){} }

function applyShopSettings(){
  document.getElementById('shopName').textContent = shopSettings.name || 'Order Book';
  document.getElementById('shopTag').textContent = shopSettings.tag || '';
  document.title = shopSettings.name || 'Order Book';
}

function fmtMoney(n){ return 'Rs. ' + Number(n).toLocaleString(); }
function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}); }
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function render(){
  renderStats();
  if(currentTab === 'orders') renderOrders();
  else if(currentTab === 'customers') renderCustomers();
  else renderStock();
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab === currentTab));
}

function renderStats(){
  const today = new Date().toDateString();
  const todaysOrders = orders.filter(o => new Date(o.date).toDateString() === today).length;
  const pending = orders.filter(o => o.status === 'pending').length;
  const lowStock = products.filter(p => p.stock <= 3).length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${todaysOrders}</div><div class="lbl">Aaj ki booking</div></div>
    <div class="stat"><div class="num">${pending}</div><div class="lbl">Pending orders</div></div>
    <div class="stat ${lowStock>0?'alert':''}"><div class="num">${lowStock}</div><div class="lbl">Low stock items</div></div>
  `;
}

function renderOrders(){
  const main = document.getElementById('mainContent');
  const sorted = [...orders].sort((a,b) => new Date(b.date) - new Date(a.date));
  if(sorted.length === 0){
    main.innerHTML = `<div class="empty">Abhi tak koi booking nahi. Neeche + button se nayi booking add karein.</div>`;
    return;
  }
  main.innerHTML = `<div class="section-title">Saari Bookings</div>` + sorted.map(o => `
    <div class="card order-card">
      <div class="row1">
        <div>
          <div class="cust">${escapeHtml(o.customerName)}</div>
          ${o.phone ? `<div class="phone">${escapeHtml(o.phone)}</div>` : ''}
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          <select class="status-select" onchange="updateStatus('${o.id}', this.value)">
            <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
            <option value="confirmed" ${o.status==='confirmed'?'selected':''}>Confirmed</option>
            <option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option>
          </select>
          <button class="del-order" onclick="deleteOrder('${o.id}')">🗑</button>
        </div>
      </div>
      <div class="items">
        ${o.items.map(it => `<div class="li"><span>${escapeHtml(it.name)} × ${it.qty}</span><span>${fmtMoney(it.price * it.qty)}</span></div>`).join('')}
      </div>
      <div class="totals">
        ${o.discountAmount > 0 ? `
          <div class="row"><span>Subtotal</span><span>${fmtMoney(o.subtotal)}</span></div>
          <div class="row disc"><span>Discount${o.discountType==='percent' ? ' ('+o.discountValue+'%)' : ''}</span><span>- ${fmtMoney(o.discountAmount)}</span></div>
        ` : ''}
        <div class="row final"><span>Total</span><span>${fmtMoney(o.total)}</span></div>
      </div>
      <div class="meta"><span class="date">${fmtDate(o.date)}</span></div>
    </div>
  `).join('');
}

function renderCustomers(){
  const main = document.getElementById('mainContent');
  if(customers.length === 0){
    main.innerHTML = `<div class="empty">Koi customer/shop save nahi. + button se add karein.</div>`;
    return;
  }
  main.innerHTML = `<div class="section-title">Customers / Shops</div>` + customers.map(c => `
    <div class="card customer-card" onclick="openEditCustomer('${c.id}')">
      <div>
        <div class="cname">${escapeHtml(c.name)}</div>
        ${c.phone ? `<div class="cphone">${escapeHtml(c.phone)}</div>` : ''}
      </div>
      ${c.discountType !== 'none' ? `<div class="cdisc">${c.discountType==='percent' ? c.discountValue+'% off' : 'Rs.'+c.discountValue+' off'}</div>` : ''}
    </div>
  `).join('');
}

function renderStock(){
  const main = document.getElementById('mainContent');
  if(products.length === 0){
    main.innerHTML = `<div class="empty">Koi product nahi. + button se product add karein.</div>`;
    return;
  }
  const cats = [...new Set(products.map(p=>p.category))];
  main.innerHTML = cats.map(cat => `
    <div class="section-title">${escapeHtml(cat)}</div>
    ${products.filter(p=>p.category===cat).map(p => `
      <div class="card product-card" onclick="openEditProduct('${p.id}')">
        ${p.image ? `<img class="pimg" src="${p.image}">` : `<div class="pimg placeholder">📦</div>`}
        <div class="pinfo">
          <div class="pname">${escapeHtml(p.name)}</div>
          ${p.code ? `<div class="pcode">${escapeHtml(p.code)}</div>` : ''}
          <div class="pcat">${escapeHtml(p.category)}</div>
        </div>
        <div class="pright">
          <div class="pprice">${fmtMoney(p.price)}</div>
          <div class="pstock ${p.stock<=3?'low':'ok'}">${p.stock} in stock${p.stock<=3?' ⚠':''}</div>
        </div>

  `).join('');
}

// ---- Order Sheet ----
const orderSheetOverlay = document.getElementById('orderSheetOverlay');
const itemRows = document.getElementById('itemRows');

function productLabel(p){ return (p.code ? p.code + ' — ' : '') + p.name; }

function refreshProductsDatalist(){
  const dl = document.getElementById('productsDatalist');
  dl.innerHTML = products.map(p => `<option value="${escapeHtml(productLabel(p))}">`).join('');
}

function findProductByLabel(label){
  label = label.trim();
  if(!label) return null;
  // try exact label match first
  let p = products.find(pr => productLabel(pr).toLowerCase() === label.toLowerCase());
  if(p) return p;
  // try code exact match
  p = products.find(pr => pr.code && pr.code.toLowerCase() === label.toLowerCase());
  if(p) return p;
  // try name contains
  p = products.find(pr => pr.name.toLowerCase() === label.toLowerCase());
  if(p) return p;
  p = products.find(pr => pr.name.toLowerCase().includes(label.toLowerCase()));
  return p || null;
}

function populateCustomerSelect(){
  const sel = document.getElementById('orderCustomerSelect');
  sel.innerHTML = `<option value="">-- Naya / Walk-in Customer --</option>` +
    customers.map(c => `<option value="${c.id}">${escapeHtml(c.name)}${c.discountType!=='none' ? ' ('+(c.discountType==='percent'?c.discountValue+'%':'Rs.'+c.discountValue)+' off)' : ''}</option>`).join('');
}

document.getElementById('orderCustomerSelect').addEventListener('change', (e) => {
  const id = e.target.value;
  if(!id){
    document.getElementById('custName').value = '';
    document.getElementById('custPhone').value = '';
    setOrderDiscType('none');
    document.getElementById('discountValue').value = '';
    updateOrderTotal();
    return;
  }
  const c = customers.find(x => x.id === id);
  if(c){
    document.getElementById('custName').value = c.name;
    document.getElementById('custPhone').value = c.phone || '';
    setOrderDiscType(c.discountType || 'none');
    document.getElementById('discountValue').value = c.discountValue || '';
    updateOrderTotal();
  }
});

function setOrderDiscType(type){
  orderDiscountType = type;
  document.querySelectorAll('.disc-type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
  document.getElementById('discountValue').style.display = (type === 'none') ? 'none' : 'block';
}
document.querySelectorAll('.disc-type-btn').forEach(btn => {
  btn.addEventListener('click', () => { setOrderDiscType(btn.dataset.type); updateOrderTotal(); });
});
document.getElementById('discountValue').addEventListener('input', updateOrderTotal);

function addItemRow(){
  if(products.length === 0){ alert('Pehle Stock tab se products add karein.'); return; }
  refreshProductsDatalist();
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `
    <div class="field code-field">
      <label>Code / Naam</label>
      <input type="text" class="item-code" list="productsDatalist" placeholder="Type karein...">
      <div class="found-name"></div>
    </div>
    <div class="field qty-field">
      <label>Qty</label>
      <input type="number" class="item-qty" value="1" min="1">
    </div>
    <button type="button" onclick="this.parentElement.remove(); updateOrderTotal();">×</button>
  `;
  const codeInput = row.querySelector('.item-code');
  const foundDiv = row.querySelector('.found-name');
  codeInput.addEventListener('input', () => {
    const p = findProductByLabel(codeInput.value);
    if(p){
      foundDiv.textContent = '✓ ' + p.name + ' — ' + fmtMoney(p.price) + ' (' + p.stock + ' left)';
      foundDiv.classList.remove('notfound');
    } else if(codeInput.value.trim()){
      foundDiv.textContent = 'Product nahi mila';
      foundDiv.classList.add('notfound');
    } else {
      foundDiv.textContent = '';
    }
    updateOrderTotal();
  });
  row.querySelector('.item-qty').addEventListener('input', updateOrderTotal);
  itemRows.appendChild(row);
}

function updateOrderTotal(){
  let subtotal = 0;
  itemRows.querySelectorAll('.item-row').forEach(row => {
    const codeVal = row.querySelector('.item-code').value;
    const qty = Number(row.querySelector('.item-qty').value) || 0;
    const p = findProductByLabel(codeVal);
    if(p) subtotal += p.price * qty;
  });

  let discountAmount = 0;
  const discVal = Number(document.getElementById('discountValue').value) || 0;
  if(orderDiscountType === 'percent') discountAmount = subtotal * (discVal/100);
  else if(orderDiscountType === 'fixed') discountAmount = discVal;
  discountAmount = Math.min(discountAmount, subtotal);

  const total = subtotal - discountAmount;

  document.getElementById('subtotalDisplay').textContent = fmtMoney(subtotal);
  document.getElementById('discountRow').style.display = discountAmount > 0 ? 'flex' : 'none';
  document.getElementById('discountDisplay').textContent = '- ' + fmtMoney(discountAmount);
  document.getElementById('orderTotalDisplay').textContent = fmtMoney(total);
}

document.getElementById('fabBtn').addEventListener('click', () => {
  if(currentTab === 'orders') openOrderSheet();
  else if(currentTab === 'customers') openNewCustomerSheet();
  else openProductSheet();
});
document.getElementById('addItemBtn').addEventListener('click', addItemRow);
document.getElementById('cancelOrderBtn').addEventListener('click', () => orderSheetOverlay.classList.remove('open'));

function openOrderSheet(){
  document.getElementById('custName').value = '';
  document.getElementById('custPhone').value = '';
  populateCustomerSelect();
  document.getElementById('orderCustomerSelect').value = '';
  setOrderDiscType('none');
  document.getElementById('discountValue').value = '';
  itemRows.innerHTML = '';
  refreshProductsDatalist();
  if(products.length > 0) addItemRow();
  updateOrderTotal();
  orderSheetOverlay.classList.add('open');
}

document.getElementById('saveOrderBtn').addEventListener('click', () => {
  const custName = document.getElementById('custName').value.trim();
  if(!custName){ alert('Customer ka naam likhein.'); return; }
  const rows = [...itemRows.querySelectorAll('.item-row')];
  if(rows.length === 0){ alert('Kam az kam ek product add karein.'); return; }

  const items = [];
  let subtotal = 0;
  for(const row of rows){
    const codeVal = row.querySelector('.item-code').value;
    const qty = Number(row.querySelector('.item-qty').value) || 0;
    const p = findProductByLabel(codeVal);
    if(p && qty > 0){
      items.push({productId: p.id, name: p.name, price: p.price, qty});
      subtotal += p.price * qty;
      p.stock = Math.max(0, p.stock - qty);
    }
  }
  if(items.length === 0){ alert('Koi valid product nahi mila. Code/naam check karein.'); return; }

  const discVal = Number(document.getElementById('discountValue').value) || 0;
  let discountAmount = 0;
  if(orderDiscountType === 'percent') discountAmount = subtotal * (discVal/100);
  else if(orderDiscountType === 'fixed') discountAmount = discVal;
  discountAmount = Math.min(discountAmount, subtotal);
  const total = subtotal - discountAmount;

  orders.push({
    id: 'o' + Date.now(),
    customerName: custName,
    phone: document.getElementById('custPhone').value.trim(),
    items, subtotal,
    discountType: orderDiscountType, discountValue: discVal, discountAmount,
    total, status: 'pending', date: new Date().toISOString()
  });
  saveOrders(); saveProducts();
  orderSheetOverlay.classList.remove('open');
  render();
});

function renderCategoryOptions(selected){

function setImagePreview(dataUrl){
  currentProdImage = dataUrl || '';
  if(currentProdImage){ prodImgPreview.src = currentProdImage; prodImgPreview.classList.remove('placeholder'); }
  else { prodImgPreview.src = ''; prodImgPreview.classList.add('placeholder'); }
}

prodImgInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxSize = 300;
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxSize){ h = h*maxSize/w; w = maxSize; } }
      else{ if(h > maxSize){ w = w*maxSize/h; h = maxSize; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      setImagePreview(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function openProductSheet(){
  editingProductId = null;
  document.getElementById('productSheetTitle').textContent = 'Naya Product';
  document.getElementById('prodName').value = '';
  document.getElementById('prodCode').value = '';
  renderCategoryOptions(categories[0]);
  document.getElementById('newCatField').style.display = 'none';
  document.getElementById('newCatInput').value = '';
  document.getElementById('prodPrice').value = '';
  document.getElementById('prodStock').value = '';
  document.getElementById('deleteProductBtn').style.display = 'none';
  setImagePreview('');
  productSheetOverlay.classList.add('open');
}

function openEditProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  editingProductId = id;
  document.getElementById('productSheetTitle').textContent = 'Product Edit Karein';
  document.getElementById('prodName').value = p.name;
  document.getElementById('prodCode').value = p.code || '';
  renderCategoryOptions(p.category);
  document.getElementById('newCatField').style.display = 'none';
  document.getElementById('newCatInput').value = '';
  document.getElementById('prodPrice').value = p.price;
  document.getElementById('prodStock').value = p.stock;
  document.getElementById('deleteProductBtn').style.display = 'block';
  setImagePreview(p.image || '');
  productSheetOverlay.classList.add('open');
}

document.getElementById('deleteProductBtn').addEventListener('click', () => {
  if(!editingProductId) return;
  if(!confirm('Ye product delete kar dein?')) return;
  products = products.filter(p => p.id !== editingProductId);
  saveProducts();
  productSheetOverlay.classList.remove('open');
  render();
});

document.getElementById('saveProductBtn').addEventListener('click', () => {
  const name = document.getElementById('prodName').value.trim();
  if(!name){ alert('Product ka naam likhein.'); return; }
  const code = document.getElementById('prodCode').value.trim();

  const newCatField = document.getElementById('newCatField');
  let category;
  if(newCatField.style.display !== 'none'){
    const newCat = document.getElementById('newCatInput').value.trim();
    if(!newCat){ alert('Nayi category ka naam likhein.'); return; }
    category = newCat;
    if(!categories.includes(newCat)){ categories.push(newCat); saveCategories(); }
  } else {
    category = document.getElementById('prodCategory').value;
  }

  const price = Number(document.getElementById('prodPrice').value) || 0;
  const stock = Number(document.getElementById('prodStock').value) || 0;

  if(editingProductId){
    const p = products.find(x => x.id === editingProductId);
    p.name = name; p.code = code; p.category = category; p.price = price; p.stock = stock; p.image = currentProdImage;
  } else {
    products.push({id: 'p' + Date.now(), name, code, category, price, stock, image: currentProdImage});
  }
  saveProducts();
  productSheetOverlay.classList.remove('open');
  render();
});
